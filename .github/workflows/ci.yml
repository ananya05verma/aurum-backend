
name: Aurum Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aurum_test
          POSTGRES_USER: aurum_test
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aurum_test -d aurum_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_URL: jdbc:postgresql://localhost:5432/aurum_test
      DB_USERNAME: aurum_test
      DB_PASSWORD: test_password
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/aurum_test
      SPRING_DATASOURCE_USERNAME: aurum_test
      SPRING_DATASOURCE_PASSWORD: test_password
      JWT_SECRET: ci-test-secret-key-for-aurum-1234567890
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Run tests
        run: bash mvnw -B test
